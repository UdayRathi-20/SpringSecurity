<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #dadada;
        }

        .nav-link {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-link:hover {
            color: black;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        .active {
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }
        .font1
        {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        a
        {
            text-decoration: none;
        }
    </style>

</head>

<body>
    <nav class="nav bg-primary justify-content-evenly">
        <p class="nav-link"><a class="font1" href="/admin/faculty">Add Faculty</a></p>
        <p class="nav-link" ><a class="font1" href="/admin/faculty/display">Display Faculty</a></p>
        <p class="nav-link"><a class="font1" href="/admin/student">Add Student</a></p>
        <p class="nav-link"><a class="font1" href="/admin/student/display">Display Student</a></p>
        <p class="nav-link"><a class="font1" href="/admin/course">Add Course</a></p>
        <p class="nav-link"><a class="font1 active" href="/admin/course/display">Display Course</a></p>
    </nav>
    <div class="px-5">
        <table border="1" class="table my-5 ">
            <thead>
                <tr>
                     <th th:text="${name}" colspan="2"></th>
                </tr>
                <tr>
                    <th>Name</th>
                    <th>Aadhar</th>

                </tr>
            </thead>
            <tbody>
                <tr th:each="item,info :${students}">
                    <td th:text="${item.getName()}"></td>
                    <td th:text="${item.getAadhar()}"></td>
                </tr>
            
            </tbody>
        </table>
    </div>
</body>

</html>
