<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #dadada;
        }

        .nav-link {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-link:hover {
            color: yellow;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        .active {
            color: yellow;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }
        .font1
        {
            color: black;
            font-size: 20px;
            font-weight: bold;
        }
    </style>

</head>

<body>
    <nav class="nav bg-primary justify-content-evenly">
        <p class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            Faculty
            <ul class="dropdown-menu">
                <li class="dropdown-item"><a class="font1"  href="/admin/faculty">Add Faculty</a></li>
                <li class="dropdown-item"><a class="font1" href="/admin/faculty/display">Display Faculty</a></li>
            </ul>
        </p>
        <p class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            Student
            <ul class="dropdown-menu">
                <li class="dropdown-item"><a class="font1" href="/admin/student">Add Student</a></li>
                <li class="dropdown-item"><a class="font1" href="/admin/student/display">Display Student</a></li>
            </ul>
        </p>
        <p class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            Course
            <ul class="dropdown-menu">
                <li class="dropdown-item"><a class="font1" href="/admin/course">Add Course</a></li>
                <li class="dropdown-item"><a class="font1" href="/admin/course/display">Display Course</a></li>
            </ul>
        </p>
        <p><a class="nav-link" href="/admin/fees">Fees</a></p>
    </nav>
    <div class="px-5">
        <table border="1" class="table my-5 ">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Aadhar</th>
                    <th colspan="2">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item :${data} ">
                    <td th:text="${item.getName()}"></td>
                    <td th:text="${item.getAadhar()}"></td>
                    <td>
                        <a th:href="@{/admin/student/remove/{sid}(sid=${item.getSid()})}"><button>Remove</button></a>
                        <a th:href="@{/admin/student/edit/{sid}(sid=${item.getSid()})}"><button>Edit</button></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
