<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <style>
        body{
            background-color: #dadada;
        }
        .nav-link {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .nav-link:hover {
            color: yellow;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }
        .font1
        {
            color: black;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav class="nav bg-primary justify-content-evenly">
        <p class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            Faculty
            <ul class="dropdown-menu">
                <li class="dropdown-item"><a class="font1"  href="/admin/faculty">Add Faculty</a></li>
                <li class="dropdown-item"><a class="font1" href="/admin/faculty/display">Display Faculty</a></li>
            </ul>
        </p>
        <p class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            Student
            <ul class="dropdown-menu">
                <li class="dropdown-item"><a class="font1" href="/admin/student">Add Student</a></li>
                <li class="dropdown-item"><a class="font1" href="/admin/student/display">Display Student</a></li>
            </ul>
        </p>
        <p class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            Course
            <ul class="dropdown-menu">
                <li class="dropdown-item"><a class="font1" href="/admin/course">Add Course</a></li>
                <li class="dropdown-item"><a class="font1" href="/admin/course/display">Display Course</a></li>
            </ul>
        </p>
        <p><a class="nav-link" href="/admin/fees">Fees</a></p>
    </nav>
    <form action="/admin/student" method="post" class="col-8 my-5 mx-auto">
        <p>Enter Name <input type="text" class="form-control" name="name"></p>
        <p>Mobile <input type="text" class="form-control" name="mobile"></p>
        <p>Aadhar <input type="text" class="form-control" name="aadhar"></p>
        <p>Course 
            <select name="cid" id="">
                <option th:each="item:${data}" th:value="${item.getCid()}"  th:text="${item.getName()}"></option>
            </select>
        </p>
        <p><button>Add </button></p>
    </form>
</body>

</html>
