<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <style>
            body
            {
                width: 100vw;
                height: 100vh;
            }
            .font1
            {
                font-size: 30px;
            }
            .font2
            {
                background: linear-gradient(270deg,#287094,rgb(24, 23, 23),#287094);
            }
            .font3
            {
                color: white;
            }
            .font4
            {
                background-color: white;
                display: flex;
                flex-direction: column;
                row-gap: 20px;
                padding-top: 20px;
            }
            .content
            {
                background-color: white;
            }
            .menu
            {
                border-right:2px solid #0f232e ;
                
            }
            .col-1
            {
                width: 60px;
            }
        
        </style>
    </head>
    <body style="height: 100vh;overflow: hidden;">
        <div class="Container-fluid">
            <div class="row font2">
                <div class="col-1  font1">
                    <ion-icon name="menu" onclick="display()"></ion-icon>
                </div>
                <div class="col-3 d-flex">
                    <h2 class="font3 d-flex align-items-center gap-5">Sunny Institute <ion-icon name="home" style="font-size: 24px;"></ion-icon></h2>
                    
                </div>
            </div>
            <div class="row" style="height: 100vh;">
                <div class="col-1 font4 menu">
                   <span class="d-flex gap-3">       
                        <span class=""><ion-icon name="home" style="font-size: 24px;"></ion-icon></span>  <!--child1-->
                        <span class="menuTitle d-none "> Home</span>                        
                    </span>
                   <span class="d-flex gap-3">       
                        <span class=""><ion-icon name="briefcase" style="font-size: 24px;"></ion-icon></span>  <!--child1-->
                        <span class="menuTitle d-none "> My Info</span>                        
                    </span>
                   <span class="d-flex gap-3">       
                        <span class=""><ion-icon name="person-sharp" style="font-size: 24px;"></ion-icon></span>  <!--child1-->
                        <span class="menuTitle d-none ">Contact us</span>                        
                    </span>
                    <span class="d-flex gap-3">       
                        <span class=""><ion-icon name="lock-closed" style="font-size: 24px;"></ion-icon></span>  <!--child1-->
                        <span class="menuTitle d-none "> My Account</span>                        
                    </span>
                     <span class="d-flex gap-3">       
                        <span class=""><a href="/logout"><ion-icon name="log-out" style="font-size: 24px;"></ion-icon></a></span>  <!--child1-->
                        <span class="menuTitle d-none "> <a href="/logout">log out</a></span>                        
                    </span>
                </div>
                <div class="col-11 content">
                    <table class="table">
                        <tr>
                            <th>Name</th>
                            <td th:text="${faculty.getName()}"></td>
                        </tr>
                        <tr>
                            <th>Qualification</th>
                            <td th:text="${faculty.getQual()}"></td>
                        </tr>
                        <tr>
                            <th>DOB</th>
                            <td th:text="${faculty.getDob()}"></td>
                        </tr>
                        <tr>
                            <th>Aadhar</th>
                            <td th:text="${faculty.getAadhar()}"></td>
                        </tr>
                        
                    </table>
                </div>
            </div>
            
        </div>

        <script>
            var menu=document.querySelector(".menu")
            var content=document.querySelector(".content")
            var menuTitle=document.querySelectorAll(".menuTitle")
            var menuShow=true
            function display()
            {
                if(menuShow==true)
                {
                    menu.classList.toggle("col-2")
                    menu.classList.toggle("col-1")

                    content.classList.toggle("col-10")
                    content.classList.toggle("col-11")

                    menuTitle.forEach((item)=>item.classList.toggle("d-none"))
                    
                }
            }
        </script>
    </body>
</html>
